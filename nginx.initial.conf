# Стартовый конфиг: только порт 80, без SSL. Используется для первого
# выпуска сертификата certbot и для отладки до включения HTTPS.
# После выпуска сертификата заменяется на nginx.conf.

server {
    listen 178.105.43.157:80;

    server_name noki.click www.noki.click;

    server_tokens off;
    client_max_body_size 30M;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        autoindex off;
    }

    location = /health { return 404; }
    location = /live { return 404; }
    location = /docs { return 404; }
    location = /redoc { return 404; }
    location = /openapi.json { return 404; }

    location /api/ {
        proxy_pass http://127.0.0.1:8010;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_redirect off;
    }

    location / {
        proxy_pass http://127.0.0.1:3015;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_redirect off;
    }
}
