[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "noki-backend"
version = "0.1.0"
description = "Async FastAPI backend for the Noki MVP"
requires-python = ">=3.10,<3.14"
dependencies = [
    "fastapi[standard]==0.140.0",
    "sqlalchemy[asyncio]==2.0.51",
    "asyncpg==0.31.0",
    "alembic==1.18.5",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "redis[hiredis]==8.0.1",
    "celery==5.6.3",
    "PyJWT[crypto]==2.13.0",
    "cryptography==48.0.1",
    "argon2-cffi==25.1.0",
    "httpx==0.28.1",
    "python-multipart==0.0.32",
    "email-validator==2.3.0",
    "pillow==12.3.0",
    "boto3==1.43.62",
    "starlette==1.3.1",
]

[project.scripts]
noki = "app.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.0,<10",
    "pytest-asyncio>=1.2,<2",
    "aiosqlite>=0.21,<0.22",
    "ruff>=0.14,<0.15",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "postgres: tests that require NOKI_TEST_DATABASE_URL backed by PostgreSQL",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "S"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"app/core/config.py" = ["S105"]
"app/core/security.py" = ["S105", "S106"]
"app/services/oauth.py" = ["S105", "S106"]
"tests/*" = ["S101"]
"tests/test_postgres_encryption.py" = ["S101", "S608"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
