# Кладётся в /etc/nginx/conf.d/noki-http.conf — объявления http-уровня,
# на которые ссылается серверный конфиг noki.click.

# WebSocket/upgrade для Next.js.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Мягкий лимит на вход и регистрацию: 5 запросов в секунду с одного IP.
# Приложение лимитирует попытки самостоятельно, это просто верхняя граница.
limit_req_zone $binary_remote_addr zone=noki_auth:10m rate=5r/s;
limit_req_status 429;
