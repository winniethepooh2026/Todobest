# ВАЖНО: применять этот конфиг ТОЛЬКО после того, как certbot успешно
# выпустил сертификат для noki.click. Пока сертификата нет на диске,
# используйте nginx.initial.conf (только порт 80) — иначе `nginx -t`
# упадёт на отсутствующих файлах сертификата.
#
# Порядок выпуска (webroot-метод):
#   sudo mkdir -p /var/www/html/.well-known/acme-challenge
#   sudo certbot certonly --webroot -w /var/www/html -d noki.click
# После успешного выпуска — заменить этим файлом текущий,
# `sudo nginx -t && sudo systemctl reload nginx`.

server {
    listen 178.105.43.157:80;

    server_name noki.click www.noki.click;

    server_tokens off;

    # Блок для валидации Certbot. Должен остаться доступным по HTTP и после
    # включения HTTPS — иначе автопродление сертификата будет падать.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        autoindex off;
    }

    location / {
        return 301 https://noki.click$request_uri;
    }
}

server {
    listen 178.105.43.157:443 ssl http2;

    server_name www.noki.click;

    ssl_certificate /etc/letsencrypt/live/noki.click/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/noki.click/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    return 301 https://noki.click$request_uri;
}

server {
    listen 178.105.43.157:443 ssl http2;

    server_name noki.click;

    server_tokens off;
    # Чуть выше лимита загрузки в 26 МиБ.
    client_max_body_size 30M;

    ssl_certificate /etc/letsencrypt/live/noki.click/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/noki.click/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header Referrer-Policy;

    # Внутренняя диагностика бэкенда наружу не публикуется:
    # /health и /live снимаются по loopback, Swagger в проде выключен.
    location = /health { return 404; }
    location = /live { return 404; }
    location = /docs { return 404; }
    location = /redoc { return 404; }
    location = /openapi.json { return 404; }

    # Мягкий лимит на вход/регистрацию (в дополнение к лимитам приложения).
    location ~ ^/api/v1/auth/(login|register)$ {
        limit_req zone=noki_auth burst=10 nodelay;

        proxy_pass http://127.0.0.1:8010;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_redirect off;
    }

    # API
    location /api/ {
        proxy_pass http://127.0.0.1:8010;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_redirect off;
    }

    # Frontend (Next.js). Сюда же идут /media/* — Next проксирует их на бэкенд.
    location / {
        proxy_pass http://127.0.0.1:3015;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_redirect off;
    }
}
